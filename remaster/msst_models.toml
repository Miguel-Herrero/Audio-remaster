# Catalogo de modelos para la pestana "Separar".
#
# Cada entrada empareja las tres cosas que `inference.py` de MSST necesita y
# que van acopladas: `model_type`, `config` y `checkpoint`. Ojo: si el YAML
# trae `training.model_type`, ese gana sobre el que se pase por linea de
# comandos, asi que el config manda.
#
# Las rutas llevan prefijo:
#   repo:  cuelga del clon de Music-Source-Separation-Training (solo lectura)
#   data:  cuelga de MSST_DATA_DIR (~/.cache/remaster/msst por defecto), que
#          es donde se escribe lo que descargamos. Nunca dentro del repo ajeno.
#
# Para anadir un modelo propio no hace falta tocar este fichero ni el codigo:
# crea `msst_models.local.toml` junto al .env (o apunta MSST_CATALOG a el) y
# sus entradas se fusionan encima de estas, sobrescribiendo por `id`.
#
# SDR = Signal-to-Distortion Ratio; mas alto es mejor. Las cifras salen de
# docs/pretrained_models.md del repo de MSST y no son comparables entre
# tareas distintas (separar voz no se mide igual que quitar ruido).

# --------------------------------------------------------------------------
# Cine y TV: dialogo / musica / efectos
# --------------------------------------------------------------------------

[[model]]
id = "bandit_v2"
name = "Bandit v2 — dialogo / musica / efectos"
model_type = "bandit_v2"
config = "repo:configs/config_dnr_bandit_v2_mus64.yaml"
checkpoint = "data:bandit_v2/checkpoint-multi_fixed.ckpt"
stems = ["speech", "music", "sfx"]
size_mb = 142
speed = { cpu = { load = 7.0, rate = 7.1 } }
cpu_only = true
note = """Trabaja a 48 kHz, como el pipeline, asi que no hay remuestreo. \
Tiene pesos por idioma: castellano, ingles y multilingue. \
Corre en CPU a la fuerza (la arquitectura usa float64 y Metal no lo \
soporta), asi que con audio largo tarda: para eso esta el boton de cancelar."""

  [[model.variant]]
  id = "multi"
  label = "multilingue"
  checkpoint = "data:bandit_v2/checkpoint-multi_fixed.ckpt"
  size_mb = 142

  [[model.variant]]
  id = "spa"
  label = "espanol"
  checkpoint = "data:bandit_v2/checkpoint-spa_fixed.ckpt"
  checkpoint_url = "https://zenodo.org/records/12701995/files/checkpoint-spa.ckpt?download=1"
  needs_fix = true
  size_mb = 142

  [[model.variant]]
  id = "eng"
  label = "ingles"
  checkpoint = "data:bandit_v2/checkpoint-eng_fixed.ckpt"
  checkpoint_url = "https://zenodo.org/records/12701995/files/checkpoint-eng.ckpt?download=1"
  needs_fix = true
  size_mb = 142

# Los otros cuatro idiomas del mismo registro de Zenodo. Se descargan igual
# (446 MB cada uno, ~142 MB una vez convertidos): descomenta el bloque que
# quieras y ejecuta `remaster msst-fetch bandit_v2 --lang fra`.
#
#   [[model.variant]]
#   id = "fra"
#   label = "frances"
#   checkpoint = "data:bandit_v2/checkpoint-fra_fixed.ckpt"
#   checkpoint_url = "https://zenodo.org/records/12701995/files/checkpoint-fra.ckpt?download=1"
#   needs_fix = true
#   size_mb = 142
#
#   ... y lo mismo con deu (aleman), cmn (mandarin) y fao (feroes),
#   cambiando las tres apariciones del codigo de idioma.

[[model]]
id = "bandit_plus"
name = "BandIt Plus — dialogo / musica / efectos"
model_type = "bandit"
config = "repo:configs/config_dnr_bandit_bsrnn_multi_mus64.yaml"
checkpoint = "repo:pretrained/bandit_plus/model_bandit_plus_dnr_sdr_11.47.chpt"
checkpoint_url = "https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v.1.0.3/model_bandit_plus_dnr_sdr_11.47.chpt"
stems = ["speech", "music", "effects"]
size_mb = 142
cpu_only = true
note = """Con metricas publicadas: DnR 11.50 de media — voz 15.64, \
musica 9.18, efectos 9.69. Trabaja a 44.1 kHz, asi que hay remuestreo \
desde los 48 kHz del pipeline, y se entreno solo con ingles. \
Corre en CPU por el mismo motivo que v2."""

# --------------------------------------------------------------------------
# Voz frente a resto
# --------------------------------------------------------------------------

