stems = ["vocals", "other"]
size_mb = 610
speed = { mps = { load = 4.4, rate = 4.44 } }
note = """El mismo modelo que usa el pipeline con `--separator local`. \
SDR vocals 10.87. Util como referencia: lo que salga aqui es lo que \
saldria en un episodio."""

