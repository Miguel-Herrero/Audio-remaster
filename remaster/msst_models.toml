# --------------------------------------------------------------------------
# Restauracion: quitar cosas de una sola pista
# --------------------------------------------------------------------------

[[model]]
id = "denoise_mel_band_roformer"
name = "MelBand Roformer denoise — quitar ruido de fondo"
model_type = "mel_band_roformer"
config = "data:denoise_mel_band_roformer/model_mel_band_roformer_denoise.yaml"
config_url = "https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v.1.0.7/model_mel_band_roformer_denoise.yaml"
checkpoint = "data:denoise_mel_band_roformer/denoise_mel_band_roformer_aufr33_sdr_27.9959.ckpt"
checkpoint_url = "https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v.1.0.7/denoise_mel_band_roformer_aufr33_sdr_27.9959.ckpt"
stems = ["dry", "other"]
size_mb = 871
note = """Separa la senal limpia del ruido (siseo, zumbido). \
Pensado justo para material viejo. SDR 27.99, que no es comparable con \
los de separacion de voz: mide otra cosa."""

[[model]]
id = "dereverb_mel_band_roformer"
name = "MelBand Roformer dereverb — quitar reverberacion"
model_type = "mel_band_roformer"
config = "data:dereverb_mel_band_roformer/dereverb_mel_band_roformer_anvuew.yaml"
