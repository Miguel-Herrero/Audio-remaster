stems = ["noreverb", "reverb"]
size_mb = 871
note = "Quita la cola de reverberacion de una voz ya separada. SDR 19.17."

[[model]]
id = "mel_band_roformer_crowd"
name = "MelBand Roformer crowd — separar publico y aplausos"
model_type = "mel_band_roformer"
config = "data:mel_band_roformer_crowd/model_mel_band_roformer_crowd.yaml"
config_url = "https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v.1.0.4/model_mel_band_roformer_crowd.yaml"
