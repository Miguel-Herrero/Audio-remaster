<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remaster</title>
<style>
/* ------------------------------------------------------------------ *
 * Sin build, sin framework, sin fuentes remotas: la UI es local y
 * tiene que funcionar sin red, igual que el resto del pipeline.
 * ------------------------------------------------------------------ */
:root {
  --bg: #14161a;
  --bg-raised: #1b1e24;
  --bg-sunken: #101216;
  --line: #2a2f38;
  --line-soft: #22262e;
  --fg: #e6e8ec;
  --fg-dim: #9aa2b1;
  --fg-faint: #6b7280;
  --accent: #7dd3a0;
  --running: #e0a758;
  --error: #e8705f;
  --manual: #a78bfa;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
[data-theme="light"] {
  --bg: #f6f7f9;
  --bg-raised: #ffffff;
  --bg-sunken: #eceef2;
  --line: #d8dce3;
  --line-soft: #e6e9ee;
  --fg: #1c1f26;
  --fg-dim: #5c6473;
  --fg-faint: #8b93a1;
  --accent: #17835a;
  --running: #a86a12;
  --error: #c0392b;
  --manual: #6d4bd6;
  --shadow: 0 1px 2px rgba(20,25,35,.06), 0 8px 24px rgba(20,25,35,.08);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.25rem 5rem; }
h1, h2, h3 { font-weight: 600; letter-spacing: -.01em; margin: 0; }
code, .mono { font-family: var(--mono); font-size: .85em; }
a { color: var(--accent); }
button {
  font: inherit; font-weight: 500; cursor: pointer;
  background: var(--bg-raised); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: .42rem .8rem;
  transition: background .15s, border-color .15s, opacity .15s;
}
button:hover:not(:disabled) { border-color: var(--fg-faint); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #0e1512; }
[data-theme="light"] button.primary { color: #fff; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; color: var(--fg-dim); padding: .3rem .5rem; }
button.ghost:hover { color: var(--fg); background: var(--bg-raised); }
input, select {
  font: inherit; background: var(--bg-sunken); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: .42rem .6rem;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
input::placeholder { color: var(--fg-faint); }
label { font-size: .9rem; }

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line-soft); margin-bottom: 1.5rem;
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: .7rem 1.25rem;
  display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
}
.brand { font-weight: 650; letter-spacing: -.02em; margin-right: .4rem; }
.tabs { display: flex; gap: .15rem; }
.tab {
  background: none; border: 1px solid transparent; color: var(--fg-dim);
  padding: .3rem .7rem; border-radius: var(--radius); font-size: .88rem;
}
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] {
  color: var(--fg); background: var(--bg-raised); border-color: var(--line);
}
.brand span { color: var(--fg-faint); font-weight: 400; }
.rootbox { display: flex; align-items: center; gap: .5rem; flex: 1; min-width: 260px; }
#root-input { flex: 1; min-width: 180px; font-family: var(--mono); font-size: .82rem; }
#root-input.drop { outline: 2px dashed var(--accent); outline-offset: 2px; }
.chip {
  font-size: .78rem; padding: .16rem .5rem; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line); color: var(--fg-dim); background: var(--bg-raised);
}
.chip.ok { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
.chip.bad { color: var(--error); border-color: color-mix(in oklab, var(--error) 45%, transparent); }

/* ---------- laboratorio de separacion ---------- */
.lab { display: grid; gap: 1.1rem; }
.lab-field { display: grid; gap: .3rem; }
.lab-field > label { font-size: .82rem; color: var(--fg-dim); }
.lab-field input[type=text] { font-family: var(--mono); font-size: .82rem; width: 100%; }
.lab-field input.drop { outline: 2px dashed var(--accent); outline-offset: 2px; }
.models { display: grid; gap: .4rem; }
.model {
  display: grid; grid-template-columns: 1.2rem 1fr auto; gap: .6rem;
  align-items: start; padding: .6rem .75rem; border: 1px solid var(--line-soft);
  border-radius: var(--radius); background: var(--bg-raised); cursor: pointer;
  transition: border-color .15s, background .15s;
}
.model:hover { border-color: var(--line); }
.model[aria-checked="true"] { border-color: var(--accent); background: var(--bg-sunken); }
.model.off { opacity: .55; }
/* El boton de descargar es lo unico accionable de una fila apagada: si
   heredara el atenuado, la unica salida de ese estado pareceria inerte. */
.model.off [data-get] { opacity: 1.7; border-color: var(--line); }
.model-mark { color: var(--fg-faint); font-size: 1rem; line-height: 1.3; }
.model[aria-checked="true"] .model-mark { color: var(--accent); }
.model-name { font-weight: 550; }
.model-stems { font-family: var(--mono); font-size: .76rem; color: var(--fg-dim); margin-top: .1rem; }
.model-sr { color: var(--fg-faint); }
.model-note { font-size: .8rem; color: var(--fg-faint); margin-top: .25rem; line-height: 1.45; }
.model-side { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
.langs { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .45rem; }
.lang {
  font-size: .78rem; padding: .18rem .55rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg-dim);
}
.lang[aria-checked="true"] { color: var(--accent); border-color: var(--accent); }
.lang.off { opacity: .5; }
.lab-opts { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.lab-eta { font-size: .82rem; color: var(--fg-dim); margin-top: -.6rem; }
.lab-eta b { color: var(--fg); font-weight: 550; }
.lab-eta span { color: var(--fg-faint); }
.lab-preview {
  font-family: var(--mono); font-size: .78rem; color: var(--fg-dim);
  background: var(--bg-sunken); border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: .55rem .7rem; word-break: break-all;
}

/* ---------- tarjetas de episodio ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem; }
.card {
  background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: .85rem .95rem; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: .55rem;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--fg-faint); transform: translateY(-1px); }
.card.active { border-color: var(--accent); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.card-code { font-weight: 600; font-family: var(--mono); font-size: .95rem; }
.ring { width: 26px; height: 26px; flex: none; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .4s; }
.card-meta { font-size: .8rem; color: var(--fg-dim); }
.badges { display: flex; gap: .3rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .1rem .42rem; border-radius: 5px; background: var(--bg-sunken); color: var(--fg-dim); }
.badge.edited { color: var(--manual); background: color-mix(in oklab, var(--manual) 14%, transparent); }
.badge.done { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }

/* ---------- timeline ---------- */
.runner { margin-top: 1.75rem; scroll-margin-top: 4.2rem; }
.runner-head {
  display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
  margin-bottom: .2rem;
}
.runner-head h2 { font-family: var(--mono); font-size: 1.15rem; }
.runner-path { font-size: .78rem; color: var(--fg-faint); font-family: var(--mono); }
.timeline { margin: 1.1rem 0 0; }
.node {
  position: relative; display: grid; grid-template-columns: 1.9rem 1fr; gap: .8rem;
  padding: 0 0 .1rem;
}
/* La linea punteada que une los nodos. Se pinta solida cuando el paso de
   arriba ya esta hecho, asi que el recorrido completo hace de barra de
   progreso sin necesidad de una barra. */
.node::before {
  content: ""; position: absolute; left: .92rem; top: 1.55rem; bottom: -.35rem;
  border-left: 2px dotted var(--line);
}
.node:last-child::before { display: none; }
.node.filled::before { border-left-style: solid; border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.node-dot {
  width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--line); color: var(--fg-faint);
  font-size: .82rem; z-index: 1; transition: border-color .15s, color .15s;
}
.node-body {
  padding: .18rem 0 1rem; border-radius: 8px; cursor: pointer;
}
.node-line { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.node-num { color: var(--fg-faint); font-size: .78rem; font-variant-numeric: tabular-nums; min-width: 1.1rem; }
.node-title { font-weight: 550; }
.node-key { font-family: var(--mono); font-size: .74rem; color: var(--fg-faint); }
.node-dur { margin-left: auto; font-size: .78rem; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.node-summary { font-size: .855rem; color: var(--fg-dim); margin-top: .1rem; max-width: 62ch; }
.node-note { font-size: .8rem; margin-top: .25rem; }
.node-safeguard {
  font-size: .8rem; color: var(--fg-faint); margin-top: .35rem; max-width: 62ch;
  padding-left: .6rem; border-left: 2px solid var(--line-soft);
}

.node[data-state="done"] .node-dot { border-color: var(--accent); color: var(--accent); }
.node[data-state="noop"] .node-dot { border-color: var(--line); color: var(--fg-dim); }
.node[data-state="running"] .node-dot { border-color: var(--running); color: var(--running); animation: pulse 1.4s ease-in-out infinite; }
.node[data-state="error"] .node-dot { border-color: var(--error); color: var(--error); }
.node[data-state="skipped"] .node-dot { border-color: var(--line); color: var(--fg-faint); }
.node.manual .node-dot { border-color: var(--manual); color: var(--manual); }
.node[data-state="done"].manual .node-dot { border-color: var(--accent); color: var(--accent); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Rango seleccionado */
.node.in-range .node-body { background: color-mix(in oklab, var(--accent) 7%, transparent); }
.node.in-range .node-title { color: var(--fg); }
.node:not(.in-range) .node-title { color: var(--fg-dim); }
.node.warn .node-body { background: color-mix(in oklab, var(--error) 10%, transparent); }
.node.warn .node-title { color: var(--error); }

/* ---------- paneles contextuales ---------- */
.panel {
  margin-top: .7rem; padding: .8rem .9rem; background: var(--bg-raised);
  border: 1px solid var(--line-soft); border-radius: 9px; cursor: default;
}
.panel h4 { margin: 0 0 .45rem; font-size: .85rem; font-weight: 600; color: var(--fg-dim); }
.panel .hint { font-size: .82rem; color: var(--fg-dim); margin: .35rem 0; max-width: 68ch; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .4rem 0; }
.cal-point { display: flex; gap: .45rem; align-items: center; }
.cal-point input { width: 8rem; }
.cal-point .n { font-size: .78rem; color: var(--fg-faint); width: 1.2rem; }
table.mini { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .5rem 0; }
table.mini th, table.mini td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid var(--line-soft); }
table.mini th { color: var(--fg-faint); font-weight: 500; }
.ok { color: var(--accent); }
.bad { color: var(--error); }
.warnc { color: var(--running); }

/* ---------- barra de ejecucion ---------- */
.runbar {
  /* Los puntos del timeline llevan z-index para taparle la linea al
     conector. Sin un z-index mayor aqui, se cuelan por encima del boton
     al hacer scroll — y el degradado transparente no los oculta. */
  position: sticky; bottom: 0; z-index: 10; margin-top: .5rem;
  padding: 1.4rem 0 .9rem;
  background: linear-gradient(to top, var(--bg) 0, var(--bg) 68%, transparent);
  display: flex; gap: .7rem; align-items: center; flex-wrap: wrap;
}
.runbar .what { font-size: .85rem; color: var(--fg-dim); }
#log-wrap { margin-top: .5rem; }
#log-wrap summary { font-size: .82rem; color: var(--fg-dim); cursor: pointer; user-select: none; }
#log {
  background: var(--bg-sunken); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: .7rem .8rem; max-height: 320px; overflow-y: auto; margin-top: .5rem;
  font-family: var(--mono); font-size: .78rem; white-space: pre-wrap; color: var(--fg-dim);
}

/* ---------- vacios y toast ---------- */
.empty {
  border: 1px dashed var(--line); border-radius: var(--radius); padding: 2rem 1.5rem;
  text-align: center; color: var(--fg-dim); font-size: .9rem;
}
.empty strong { color: var(--fg); display: block; margin-bottom: .3rem; font-size: 1rem; }
#toasts { position: fixed; right: 1.1rem; bottom: 1.1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 50; }
.toast {
  background: var(--bg-raised); border: 1px solid var(--line); border-left-width: 3px;
  border-radius: 8px; padding: .6rem .85rem; box-shadow: var(--shadow); font-size: .87rem;
  animation: slidein .2s ease-out;
}
.toast.ok { border-left-color: var(--accent); }
.toast.bad { border-left-color: var(--error); }
@keyframes slidein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">remaster<span> · audio</span></div>
    <nav class="tabs">
      <button class="tab" data-view="episodes" aria-current="page">Episodios</button>
      <button class="tab" data-view="separar">Separar</button>
    </nav>
    <div class="rootbox" id="rootbox">
      <input type="text" id="root-input" spellcheck="false"
             placeholder="/ruta/a/tus/episodios — o arrastra la carpeta aqui">
      <span class="chip" id="root-chip">…</span>
      <select id="root-recent" style="display:none" title="carpetas recientes"></select>
    </div>
    <button class="ghost" id="theme-btn" title="claro / oscuro">◐</button>
  </div>
</header>

<div class="wrap">
<div id="view-episodes">
  <div id="episodes"></div>

  <section class="runner" id="runner" style="display:none">
    <div class="runner-head">
      <h2 id="runner-code"></h2>
      <span class="runner-path" id="runner-path"></span>
      <span class="badges" id="runner-badges"></span>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="runbar">
      <button class="primary" id="run-btn">Ejecutar</button>
      <button class="ghost" id="run-cancel" style="display:none">Cancelar</button>
      <span class="what" id="run-what"></span>
      <label style="margin-left:auto"><input type="checkbox" id="force"> rehacer aunque este al dia</label>
      <span class="chip" id="run-status" style="display:none"></span>
    </div>

    <details id="log-wrap">
      <summary>ver salida</summary>
      <pre id="log"></pre>
    </details>
  </section>
</div>

<div id="view-separar" style="display:none">
  <div class="lab">
    <div class="lab-field">
      <label for="sep-input">Archivo de audio</label>
      <input type="text" id="sep-input" spellcheck="false"
             placeholder="/ruta/al/audio.flac — o arrastra el fichero aqui">
    </div>

    <div class="lab-field">
      <label for="sep-out">Carpeta de salida</label>
      <input type="text" id="sep-out" spellcheck="false">
    </div>

    <div class="lab-field">
      <label>Modelo</label>
      <div class="models" id="sep-models" role="radiogroup"></div>
    </div>

    <div class="lab-opts">
      <label>Formato
        <select id="sep-format">
          <option value="flac24">FLAC 24 bits</option>
          <option value="wav32">WAV 32 bits float</option>
        </select>
      </label>
      <label><input type="checkbox" id="sep-inst"> invertir para sacar el complementario</label>
      <label><input type="checkbox" id="sep-tta"> TTA (triplica el tiempo)</label>
      <label><input type="checkbox" id="sep-cpu"> forzar CPU</label>
    </div>

    <div class="lab-preview" id="sep-preview">elige un archivo y un modelo</div>
    <div class="lab-eta" id="sep-eta"></div>

    <div class="runbar">
      <button class="primary" id="sep-btn">Separar</button>
      <button class="ghost" id="sep-cancel" style="display:none">Cancelar</button>
      <span class="chip" id="sep-status" style="display:none"></span>
    </div>

    <details id="sep-log-wrap">
      <summary>ver salida</summary>
      <pre id="sep-log"></pre>
    </details>
  </div>
</div>
</div>

<div id="toasts"></div>

<script>
'use strict';

// ---------------------------------------------------------------- estado
let STEPS = [];            // metadatos de /api/steps, en orden
let episodes = [];
let current = null;        // episodio abierto (objeto de /api/episodes)
let rangeFrom = 0, rangeTo = 0;
let liveStates = {};       // step -> {state, outcome, seconds, reason} del job en curso
let pollTimer = null;
let jobRunning = false;
// Los paneles se construyen una vez y se REUTILIZAN: appendChild mueve el
// nodo existente en vez de recrearlo, asi que redibujar el timeline cada
// 1.2s mientras corre un job no te quita el foco de un campo a medio
// escribir. Quien cambia el contenido de un panel lo invalida a mano.
let panelCache = {};

// Vista "Separar": catalogo de MSST y lo elegido ahora mismo.
let msstInfo = null;
let msstModels = [];
let sepModel = null;
let sepLang = null;
let sepJob = null;
let sepTimer = null;
let runJob = null;

const $ = (id) => document.getElementById(id);
const GLYPH = { pending: '○', running: '◐', done: '✓', noop: '·', skipped: '⊘', error: '✕' };

// ---------------------------------------------------------------- tema
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('remaster-theme', t); } catch (e) {}
}
$('theme-btn').addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
// Oscuro por defecto — se trabaja con REAPER al lado, que tambien lo es.
// El interruptor manda, y se recuerda.
try { applyTheme(localStorage.getItem('remaster-theme') || 'dark'); } catch (e) { applyTheme('dark'); }

// ---------------------------------------------------------------- utilidades
async function api(url, opts) {
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.detail) || `${res.status} ${res.statusText}`);
  return data;
}
async function post(url, body) {
  return api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
function fmtSeconds(s) {
  if (s == null) return '';
  if (s < 60) return `${s < 10 ? s.toFixed(1) : Math.round(s)}s`;
  const m = Math.floor(s / 60);
  return `${m}m ${Math.round(s - m * 60)}s`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------- carpeta base
async function loadRoot() {
  const info = await api('/api/root');
  $('root-input').value = info.path;
  paintRootChip(info);
  const sel = $('root-recent');
  if (info.recent && info.recent.length > 1) {
    sel.innerHTML = '<option value="">recientes…</option>' +
      info.recent.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
    sel.style.display = '';
  } else {
    sel.style.display = 'none';
  }
}
function paintRootChip(info) {
  const chip = $('root-chip');
  if (!info.exists) { chip.textContent = 'no existe'; chip.className = 'chip bad'; return; }
  chip.textContent = info.episode_count === 1 ? '1 episodio' : `${info.episode_count} episodios`;
  chip.className = 'chip ' + (info.episode_count ? 'ok' : '');
}
async function setRoot(path) {
  try {
    const info = await post('/api/root', { path });
    $('root-input').value = info.path;
    paintRootChip(info);
    current = null;
    $('runner').style.display = 'none';
    await loadRoot();
    await loadEpisodes();
  } catch (e) {
    $('root-chip').textContent = e.message;
    $('root-chip').className = 'chip bad';
  }
}
$('root-input').addEventListener('change', (e) => setRoot(e.target.value));
$('root-recent').addEventListener('change', (e) => { if (e.target.value) setRoot(e.target.value); });

// Arrastrar del Finder. Chrome/Safari en macOS ponen el `file://` en
// text/uri-list; si el navegador solo da el nombre, se rellena con lo que
// haya y se avisa, en vez de fingir que ha funcionado. Lo usan tanto la
// carpeta base como el fichero a separar.
function wireDrop(input, onPath, onNameOnly) {
  ['dragenter', 'dragover'].forEach(ev => input.addEventListener(ev, (e) => {
    e.preventDefault(); input.classList.add('drop');
  }));
  ['dragleave', 'drop'].forEach(ev =>
    input.addEventListener(ev, () => input.classList.remove('drop')));
  input.addEventListener('drop', (e) => {
    e.preventDefault();
    const dt = e.dataTransfer;
    let path = (dt.getData('text/uri-list') || '').split('\n').find(l => l && !l.startsWith('#')) || '';
    if (!path) path = dt.getData('text/plain') || '';
    if (path.startsWith('file://')) {
      try { path = decodeURIComponent(new URL(path).pathname); } catch (err) { path = ''; }
    }
    if (path) { onPath(path.replace(/\/$/, '')); return; }

    const item = dt.items && dt.items[0];
    const entry = item && item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (entry && onNameOnly) onNameOnly(entry.name);
  });
}

wireDrop($('root-input'), setRoot, (name) => {
  $('root-input').value = name;
  $('root-chip').textContent = 'tu navegador solo da el nombre — completa la ruta';
  $('root-chip').className = 'chip bad';
  $('root-input').focus();
});

// ---------------------------------------------------------------- episodios
async function loadEpisodes() {
  episodes = await api('/api/episodes');
  const box = $('episodes');
  if (!episodes.length) {
    const info = await api('/api/root');
    box.innerHTML = info.exists
      ? `<div class="empty"><strong>Ninguna carpeta de episodio aqui</strong>
           Se espera una carpeta por episodio, cada una con <code>00_sources/</code> dentro.</div>`
      : `<div class="empty"><strong>Elige la carpeta con tus episodios</strong>
           Escribe la ruta arriba, o arrastra la carpeta desde el Finder al campo.</div>`;
    return;
  }
  box.innerHTML = '<div class="grid"></div>';
  const grid = box.firstChild;
  for (const ep of episodes) {
    const done = Object.keys(ep.steps).length;
    const frac = done / ep.steps_total;
    const card = document.createElement('button');
    card.className = 'card' + (current && current.path === ep.path ? ' active' : '');
    card.innerHTML = `
      <div class="card-top">
        <span class="card-code">${escapeHtml(ep.code)}</span>
        <svg class="ring" viewBox="0 0 32 32">
          <circle class="bg" cx="16" cy="16" r="13"></circle>
          <circle class="fg" cx="16" cy="16" r="13" transform="rotate(-90 16 16)"
                  stroke-dasharray="${(frac * 81.7).toFixed(1)} 81.7"></circle>
        </svg>
      </div>
      <div class="card-meta">${done ? `${done} de ${ep.steps_total} pasos` : 'sin empezar'}</div>
      <div class="badges">
        ${ep.rpp_hand_edited ? '<span class="badge edited">editado a mano</span>' : ''}
        ${ep.has_verify ? '<span class="badge">informe</span>' : ''}
        ${ep.has_final_mkv ? '<span class="badge done">MKV</span>' : ''}
      </div>`;
    card.addEventListener('click', () => openEpisode(ep.path));
    grid.appendChild(card);
  }
}

async function openEpisode(path) {
  current = episodes.find(e => e.path === path) || null;
  if (!current) return;
  liveStates = {};
  panelCache = {};
  $('runner').style.display = '';
  $('runner-code').textContent = current.code;
  $('runner-path').textContent = current.path;
  paintRunnerBadges();
  // Al abrir, el rango util por defecto es "lo que falta". Si no falta
  // nada, lo que toca es revisar: es el bucle editar ⇄ verify.
  const firstPending = STEPS.findIndex(s => !current.steps[s.key]);
  if (firstPending === -1) {
    rangeFrom = rangeTo = STEPS.findIndex(s => s.key === 'verify');
  } else {
    rangeFrom = firstPending;
    rangeTo = STEPS.length - 1;
  }
  renderTimeline();
  await loadEpisodes();
  refreshVerifyPanel();
  if (location.hash.slice(1) !== current.code) location.hash = current.code;
  $('runner').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function paintRunnerBadges() {
  const b = [];
  if (current.rpp_hand_edited) b.push('<span class="badge edited">editado a mano</span>');
  if (current.has_rpp) b.push('<span class="badge">.RPP</span>');
  if (current.has_verify) b.push(
    `<span class="badge"><a href="/api/episodes/${encodeURIComponent(current.code)}/verify.html"
      target="_blank" style="color:inherit">informe ↗</a></span>`);
  if (current.has_align_png) b.push(
    `<span class="badge"><a href="/api/episodes/${encodeURIComponent(current.code)}/align.png"
      target="_blank" style="color:inherit">sync ↗</a></span>`);
  if (current.has_final_mkv) b.push('<span class="badge done">MKV</span>');
  $('runner-badges').innerHTML = b.join('');
}

// El hash sirve para dos cosas: "#/separar" elige vista, y cualquier otra
// cosa es un codigo de episodio. Se conserva la segunda forma para que los
// enlaces "#s03e01" que ya existan sigan abriendo lo suyo.
function showView(name) {
  const sep = name === 'separar';
  $('view-episodes').style.display = sep ? 'none' : '';
  $('view-separar').style.display = sep ? '' : 'none';
  $('rootbox').style.display = sep ? 'none' : '';
  document.querySelectorAll('.tab').forEach(tab => {
    if (tab.dataset.view === (sep ? 'separar' : 'episodes')) tab.setAttribute('aria-current', 'page');
    else tab.removeAttribute('aria-current');
  });
  if (sep && !msstModels.length) loadMsst();
}

// Se cambia de vista a mano y luego se ajusta el hash, no al reves: el
// evento `hashchange` llega tarde, y si el hash ya coincidia no llegaria
// nunca, dejando el nav marcando una vista que no es la que se ve.
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  const view = tab.dataset.view;
  showView(view);
  const hash = view === 'separar' ? '#/separar' : '';
  if (location.hash !== hash) {
    history.replaceState(null, '', hash || location.pathname + location.search);
  }
}));

function openFromHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (raw.startsWith('/')) { showView(raw.slice(1) || 'episodes'); return; }
  showView('episodes');
  if (!raw) return;
  const ep = episodes.find(e => e.code === raw);
  if (ep && (!current || current.code !== raw)) openEpisode(ep.path);
}
window.addEventListener('hashchange', openFromHash);

// ---------------------------------------------------------------- timeline
// El `outcome` que manda la traza y el estado que pinta la UI no son lo
// mismo: la traza dice si el paso hizo trabajo ("ran") y la UI dibuja si
// esta hecho ("done"). Sin esta tabla, un paso recien ejecutado llegaba
// como "ran", que no esta ni en GLYPH ni en el CSS, y se quedaba con el
// circulo de pendiente y la linea punteada.
const OUTCOME_STATE = { ran: 'done', noop: 'noop', skipped: 'skipped', error: 'error' };

function stepState(i) {
  const key = STEPS[i].key;
  const live = liveStates[key];
  if (live) {
    if (live.state === 'running') return 'running';
    return OUTCOME_STATE[live.outcome] || 'done';
  }
  if (current && current.steps[key]) return 'done';
  return 'pending';
}

function renderTimeline() {
  const tl = $('timeline');
  tl.innerHTML = '';
  STEPS.forEach((info, i) => {
    const state = stepState(i);
    const live = liveStates[info.key];
    const inRange = i >= rangeFrom && i <= rangeTo;
    const warnsProject = info.key === 'project' && inRange && current && current.rpp_hand_edited;

    const node = document.createElement('div');
    node.className = 'node'
      + (info.manual ? ' manual' : '')
      + (inRange ? ' in-range' : '')
      + (warnsProject ? ' warn' : '')
      + (state === 'done' || state === 'noop' ? ' filled' : '');
    node.dataset.state = state;
    node.dataset.step = info.key;

    const seconds = live ? live.seconds : (current && current.steps[info.key] || {}).seconds;
    const note = warnsProject
      ? `<div class="node-note bad">Tu .RPP tiene cambios que no hizo el pipeline. Este paso se negara a
         pisarlos: quita este paso del rango (empieza en «verify» o «render») o marca «rehacer» para
         regenerarlo, que guarda una copia antes.</div>`
      : (live && live.reason ? `<div class="node-note" style="color:var(--fg-faint)">${escapeHtml(live.reason)}</div>` : '');

    node.innerHTML = `
      <div class="node-dot">${GLYPH[state] || '○'}</div>
      <div class="node-body">
        <div class="node-line">
          <span class="node-num">${i + 1}</span>
          <span class="node-title">${escapeHtml(info.title)}</span>
          <span class="node-key">${escapeHtml(info.key)}</span>
          ${info.manual ? '<span class="badge edited">manual</span>' : ''}
          ${state === 'noop' ? '<span class="badge">sin cambios</span>' : ''}
          <span class="node-dur">${fmtSeconds(seconds)}</span>
        </div>
        <div class="node-summary">${escapeHtml(info.summary)}</div>
        ${note}
        <div class="node-safeguard">${escapeHtml(info.safeguard)}</div>
      </div>`;

    const body = node.querySelector('.node-body');
    body.addEventListener('click', (e) => {
      if (e.target.closest('.panel')) return;
      if (e.shiftKey) {
        if (i < rangeFrom) rangeFrom = i; else rangeTo = i;
      } else {
        rangeFrom = rangeTo = i;
      }
      renderTimeline();
      refreshVerifyPanel();
    });

    const panel = buildPanel(info.key, inRange);
    if (panel) body.appendChild(panel);
    tl.appendChild(node);
  });
  paintRunBar();
}

function paintRunBar() {
  const a = STEPS[rangeFrom], b = STEPS[rangeTo];
  $('run-what').textContent = rangeFrom === rangeTo
    ? `solo «${a.title}»`
    : `${rangeTo - rangeFrom + 1} pasos: ${a.key} → ${b.key}`;
  const blockedVerify = a.key === 'verify' && b.key === 'verify' && !verifyReady;
  $('run-btn').disabled = blockedVerify || jobRunning;
  $('run-btn').textContent = jobRunning ? 'Ejecutando…'
    : (blockedVerify ? 'Mide primero en REAPER' : 'Ejecutar');
}

// ---------------------------------------------------------------- paneles
const PANEL_HTML = { align: calibrationHtml, separate: separatorHtml, verify: verifyHtml, mux: nameHtml };
const PANEL_WIRE = { align: wireCalibration, separate: wireSeparator, verify: wireVerify, mux: wireName };

function buildPanel(key, inRange) {
  if (!inRange || !PANEL_HTML[key]) return null;
  // Calibrar es corregir un sync que ya existe: antes del primer `align`
  // no hay nada que corregir, y el panel solo estorbaria.
  if (key === 'align' && !(current && current.steps.align)) return null;
  if (panelCache[key]) return panelCache[key];
  const el = document.createElement('div');
  el.className = 'panel';
  if (key === 'verify') el.id = 'verify-panel';
  el.innerHTML = PANEL_HTML[key]();
  PANEL_WIRE[key](el);
  panelCache[key] = el;
  return el;
}

/** Rehacer el contenido de un panel: solo cuando cambia de verdad. */
function repaintPanel(key) {
  delete panelCache[key];
  renderTimeline();
}

/* --- align: calibracion manual --- */
let calPoints = [{ es: '', en: '' }, { es: '', en: '' }];
let calAgainst = 0;
let calResult = null;

function calibrationHtml() {
  const rows = calPoints.map((p, i) => `
    <div class="cal-point">
      <span class="n">${i + 1}.</span>
      ES <input type="number" step="0.001" class="cal-es" value="${p.es}" placeholder="segundos">
      EN <input type="number" step="0.001" class="cal-en" value="${p.en}" placeholder="segundos">
      <button class="ghost cal-del" ${calPoints.length <= 2 ? 'disabled' : ''}>quitar</button>
    </div>`).join('');
  return `
    <h4>Calibrar el sync a mano (opcional)</h4>
    <p class="hint">Si el sync automatico no acaba de cuadrar, mide en REAPER el mismo instante en las dos
      pistas y apuntalo aqui. Con 2 puntos se resuelve exacto; con mas, por minimos cuadrados.</p>
    <div id="cal-points">${rows}</div>
    <div class="row">
      <button class="ghost" id="cal-add">+ punto</button>
      <label>offset ya aplicado (s)
        <input type="number" id="cal-against" step="0.001" value="${calAgainst}" style="width:6rem"></label>
      <span class="hint" style="margin:0">0 si mediste contra las fuentes sin corregir.</span>
    </div>
    <div class="row">
      <button id="cal-calc">Calcular</button>
      <button id="cal-apply" ${calResult ? '' : 'disabled'}>Aplicar a este episodio</button>
    </div>
    <div id="cal-out">${calResult ? calResultHtml(calResult) : ''}</div>`;
}
function calResultHtml(d) {
  const rows = d.points.map((p, i) =>
    `<tr><td>${i + 1}</td><td>${p.es}</td><td>${p.en}</td><td>${d.residuals[i].toFixed(4)}</td></tr>`).join('');
  return `<table class="mini"><thead><tr><th>Punto</th><th>ES (s)</th><th>EN (s)</th><th>Residuo (s)</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="hint">offset <b>${d.offset_seconds.toFixed(4)}s</b> · deriva <b>${d.drift_slope.toFixed(7)}</b></div>
    ${d.appliedMsg || ''}`;
}
function readCalPoints(root) {
  const rows = [...root.querySelectorAll('.cal-point')];
  calPoints = rows.map(r => ({ es: r.querySelector('.cal-es').value, en: r.querySelector('.cal-en').value }));
  return calPoints.filter(p => p.es !== '' && p.en !== '').map(p => ({ es: +p.es, en: +p.en }));
}
function wireCalibration(root) {
  root.querySelector('#cal-add').addEventListener('click', () => {
    readCalPoints(root); calPoints.push({ es: '', en: '' }); repaintPanel('align');
  });
  root.querySelectorAll('.cal-del').forEach((b, i) => b.addEventListener('click', () => {
    readCalPoints(root); calPoints.splice(i, 1); repaintPanel('align');
  }));
  root.querySelector('#cal-against').addEventListener('change', e => { calAgainst = +e.target.value || 0; });
  const submit = async (apply) => {
    const points = readCalPoints(root);
    const out = root.querySelector('#cal-out');
    if (points.length < 2) { out.innerHTML = '<div class="hint bad">Hacen falta 2 puntos con los dos valores.</div>'; return; }
    try {
      const d = await post('/api/calibrate', { episode: current.path, points, against_offset: calAgainst, apply });
      d.points = points;
      if (apply) {
        d.appliedMsg = d.step_ran
          ? '<div class="hint ok">Aplicado. He puesto el rango a partir de «loudness» para no repetir align, que la sobrescribiria.</div>'
          : '<div class="hint">Sin cambios: ya estaba aplicado con estos valores.</div>';
      }
      calResult = d;
      if (apply) {
        const li = STEPS.findIndex(s => s.key === 'loudness');
        if (li !== -1) { rangeFrom = li; rangeTo = Math.max(li, rangeTo); }
        await loadEpisodes();
      }
      repaintPanel('align');
    } catch (e) {
      out.innerHTML = `<div class="hint bad">${escapeHtml(e.message)}</div>`;
    }
  };
  root.querySelector('#cal-calc').addEventListener('click', () => submit(false));
  root.querySelector('#cal-apply').addEventListener('click', () => submit(true));
}

function wireVerify() { /* sin interaccion propia: se ejecuta con el boton del rango */ }

async function refreshVerifyPanel() {
  if (!current) return;

// ---------------------------------------------------------------- separar
async function loadMsst() {
  try {
    msstInfo = await api('/api/msst');
  } catch (e) { toast(e.message, 'bad'); return; }

  if (!$('sep-out').value) $('sep-out').value = msstInfo.output_dir || '';
  try {
    msstModels = await api('/api/msst/models');
  } catch (e) { msstModels = []; }

  if (!sepModel) {
    const ready = msstModels.find(m => m.ready) || msstModels[0];
    if (ready) selectModel(ready.id);
  }
  renderModels();
}

function selectModel(id) {
  sepModel = id;
  const model = msstModels.find(m => m.id === id);
  // Al cambiar de modelo, el idioma anterior no tiene por que existir aqui.
  const langs = (model && model.variants) || [];
  const usable = langs.filter(v => v.checkpoint_ok);
  sepLang = usable.length ? (usable.find(v => v.id === sepLang) || usable[0]).id : null;
}

function renderModels() {
  const box = $('sep-models');
  box.innerHTML = '';
  if (!msstModels.length) {
    box.innerHTML = '<div class="empty">No hay catalogo. Revisa la ruta del repo de MSST.</div>';
    return;
  }

  for (const model of msstModels) {
    const el = document.createElement('div');
    el.className = 'model' + (model.ready ? '' : ' off');
    el.setAttribute('role', 'radio');
    el.setAttribute('aria-checked', String(model.id === sepModel));

    const side = model.ready
      ? (model.cpu_only ? '<span class="chip">CPU</span>' : '<span class="chip ok">listo</span>')
      : (model.downloadable
          ? `<button class="ghost" data-get="${model.id}">bajar ${model.size_mb} MB</button>`
          : '<span class="chip bad">sin pesos</span>');

    let langs = '';
    if (model.variants.length) {
      langs = '<div class="langs">' + model.variants.map(v => {
        if (!v.checkpoint_ok) {
          return `<button class="lang off" data-get="${model.id}" data-lang="${v.id}"
                   title="descargar ${v.size_mb} MB">${escapeHtml(v.label)} ↓</button>`;
        }
        const on = model.id === sepModel && v.id === sepLang;
        return `<button class="lang" data-lang="${v.id}" aria-checked="${on}">${escapeHtml(v.label)}</button>`;
      }).join('') + '</div>';
    }

    el.innerHTML = `
      <span class="model-mark">${model.id === sepModel ? '◉' : '○'}</span>
      <div>
        <div class="model-name">${escapeHtml(model.name)}</div>
        <div class="model-stems">${model.stems.join(' · ') || 'segun el config'}${
          model.sample_rate ? ` <span class="model-sr">· ${model.sample_rate / 1000} kHz</span>` : ''}</div>
        ${model.note ? `<div class="model-note">${escapeHtml(model.note)}</div>` : ''}
        ${langs}
      </div>
      <div class="model-side">${side}</div>`;

    el.addEventListener('click', (e) => {
      const get = e.target.closest('[data-get]');
      if (get) {
        e.stopPropagation();
        downloadModel(get.dataset.get, get.dataset.lang || null);
        return;
      }
      const lang = e.target.closest('.lang[data-lang]');
      if (lang && !lang.classList.contains('off')) {
        e.stopPropagation();
        sepModel = model.id;
        sepLang = lang.dataset.lang;
      } else {
        selectModel(model.id);
      }
      renderModels();
      paintPreview();
      refreshEta();
    });
    box.appendChild(el);
  }
  paintPreview();
}

function paintPreview() {
  const audio = ($('sep-input').value || '').trim();
  const model = msstModels.find(m => m.id === sepModel);
  if (!audio || !model) {
    $('sep-preview').textContent = 'elige un archivo y un modelo';
    return;
  }
  const stem = audio.split('/').pop().replace(/\.[^.]+$/, '');
  const slug = sepLang ? `${model.id}_${sepLang}` : model.id;
  const ext = $('sep-format').value === 'flac24' ? 'flac' : 'wav';
  const stems = model.stems.length ? model.stems.join(',') : 'pistas';
  const out = ($('sep-out').value || '').replace(/\/$/, '');
  $('sep-preview').textContent = `${out}/${stem}_${slug}_{${stems}}.${ext}`;
}

['sep-input', 'sep-out', 'sep-format'].forEach(id =>
  $(id).addEventListener('input', () => { paintPreview(); scheduleEta(); }));
$('sep-format').addEventListener('change', paintPreview);
$('sep-cpu').addEventListener('change', scheduleEta);

let etaTimer = null;
function scheduleEta() {
  // El campo se escribe letra a letra y cada consulta lanza un ffprobe:
  // se espera a que pare de teclear.
  clearTimeout(etaTimer);
  etaTimer = setTimeout(refreshEta, 400);
}

async function refreshEta() {
  const audio = ($('sep-input').value || '').trim();
  const box = $('sep-eta');
  if (!audio || !sepModel) { box.innerHTML = ''; return; }
  const params = new URLSearchParams({
    path: audio, model: sepModel, lang: sepLang || '',
    cpu: $('sep-cpu').checked ? 'true' : 'false',
  });
  try {
    const data = await api('/api/msst/eta?' + params);
    box.innerHTML = `tardara <b>${escapeHtml(data.eta)}</b> ` +
      `<span>· ${fmtSeconds(data.audio_seconds)} de audio en ${data.device} ` +
      `· ${escapeHtml(data.source)}</span>`;
  } catch (e) {
    // Que no se pueda estimar no impide separar: se calla y ya.
    box.innerHTML = '';
  }
}

wireDrop($('sep-input'), (path) => {
  $('sep-input').value = path;
  paintPreview();
}, (name) => {
  $('sep-input').value = name;
  toast('Tu navegador solo da el nombre — completa la ruta.', 'bad');
  $('sep-input').focus();
});

// La carpeta de salida se guarda en el .env, para que la proxima vez ya este.
$('sep-out').addEventListener('change', async () => {
  try { await post('/api/msst', { output_dir: $('sep-out').value }); }
  catch (e) { toast(e.message, 'bad'); }
});

async function downloadModel(id, lang) {
  try {
    const { job_id } = await post(`/api/msst/models/${id}/download`, { lang });
    sepStatus('descargando…', '');
    watchSepJob(job_id, async () => {
      msstModels = await api('/api/msst/models');
      renderModels();
    });
  } catch (e) { toast(e.message, 'bad'); }
}

$('sep-btn').addEventListener('click', async () => {
  const audio = ($('sep-input').value || '').trim();
  if (!audio) { toast('Falta el archivo de audio.', 'bad'); return; }
  if (!sepModel) { toast('Elige un modelo.', 'bad'); return; }
  try {
    const { job_id } = await post('/api/msst/run', {
      input: audio,
      model: sepModel,
      lang: sepLang,
      output_dir: $('sep-out').value,
      format: $('sep-format').value,
      extract_instrumental: $('sep-inst').checked,
      tta: $('sep-tta').checked,
      cpu: $('sep-cpu').checked,
    });
    $('sep-log').textContent = '';
    sepStatus('separando…', '');
    watchSepJob(job_id);
  } catch (e) { toast(e.message, 'bad'); }
});

$('sep-cancel').addEventListener('click', () => cancelJob(sepJob));

async function cancelJob(jobId) {
  if (!jobId) return;
  try { await post(`/api/jobs/${jobId}/cancel`, {}); }
  catch (e) { toast(e.message, 'bad'); }
}

function sepStatus(text, kind) {
  const el = $('sep-status');
  el.style.display = '';
  el.textContent = text;
  el.className = 'chip ' + (kind || '');
}

function watchSepJob(jobId, onDone) {
  sepJob = jobId;
  $('sep-btn').disabled = true;
  $('sep-cancel').style.display = '';
  if (sepTimer) clearInterval(sepTimer);
  sepTimer = setInterval(async () => {
    let data;
    try { data = await api(`/api/jobs/${jobId}`); }
    catch (e) { clearInterval(sepTimer); sepTimer = null; return; }

    $('sep-log').textContent = data.log;
    $('sep-log').scrollTop = $('sep-log').scrollHeight;
    if (data.status === 'running') { sepStatus(`en marcha… ${fmtSeconds(data.seconds)}`, ''); return; }

    clearInterval(sepTimer);
    sepTimer = null;
    sepJob = null;
    $('sep-btn').disabled = false;
    $('sep-cancel').style.display = 'none';
    if (data.status === 'done') {
      sepStatus(`listo en ${fmtSeconds(data.seconds)}`, 'ok');
      toast(`Listo en ${fmtSeconds(data.seconds)}.`, 'ok');
    } else if (data.status === 'cancelled') {
      sepStatus('cancelado', '');
      toast('Cancelado.', 'ok');
    } else {
      sepStatus('error', 'bad');
      toast('Ha fallado. Mira la salida.', 'bad');
      $('sep-log-wrap').open = true;
    }
    if (onDone) onDone();
  }, 1000);
}

// ---------------------------------------------------------------- ejecucion
$('run-cancel').addEventListener('click', () => cancelJob(runJob));

$('run-btn').addEventListener('click', async () => {
  if (!current) return;
  try {
    const { job_id } = await post('/api/run', {
      episode: current.path,
      from_step: STEPS[rangeFrom].key,
      to_step: STEPS[rangeTo].key,
      separator,
      force: $('force').checked,
      final_name: finalName,
    });
    liveStates = {};
    jobRunning = true;
    runJob = job_id;
    $('run-cancel').style.display = '';
    $('log').textContent = '';
    $('log-wrap').open = false;
    setStatus('ejecutando…', '');
    paintRunBar();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => pollJob(job_id), 1200);
  } catch (e) { toast(e.message, 'bad'); }
});

function setStatus(text, kind) {
  const el = $('run-status');
  el.style.display = '';
  el.textContent = text;
  el.className = 'chip ' + (kind || '');
}

async function pollJob(jobId) {
  let data;
  try {
    data = await api(`/api/jobs/${jobId}`);
  } catch (e) {
    clearInterval(pollTimer); pollTimer = null; jobRunning = false;
    setStatus('se ha perdido el job', 'bad'); paintRunBar(); return;
  }

  for (const ev of data.events) {
    liveStates[ev.step] = ev.state === 'running'
      ? { state: 'running' }
      : { state: 'done', outcome: ev.outcome, seconds: ev.seconds, reason: ev.reason };
  }
  renderTimeline();

  $('log').textContent = data.log;
  $('log').scrollTop = $('log').scrollHeight;

  if (data.status === 'running') { setStatus(`ejecutando… ${fmtSeconds(data.seconds)}`, ''); return; }

  clearInterval(pollTimer);
  pollTimer = null;
  jobRunning = false;
  runJob = null;
  $('run-cancel').style.display = 'none';
  if (data.status === 'cancelled') {
    setStatus('cancelado', '');
    toast('Cancelado.', 'ok');
  } else if (data.status === 'done') {
    setStatus(`terminado en ${fmtSeconds(data.seconds)}`, 'ok');
    toast(`Listo en ${fmtSeconds(data.seconds)}.`, 'ok');
  } else {
    setStatus('error', 'bad');
    toast('Ha fallado. Mira la salida.', 'bad');
    $('log-wrap').open = true;
  }
  await loadEpisodes();
  if (current) current = episodes.find(e => e.path === current.path) || current;
  renderTimeline();
  refreshVerifyPanel();
}

// ---------------------------------------------------------------- atajos
document.addEventListener('keydown', (e) => {
  const separar = $('view-separar').style.display !== 'none';
  if (e.key === 'Escape') { cancelJob(separar ? sepJob : runJob); return; }
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'Enter') {
    if (separar) { if (!$('sep-btn').disabled) $('sep-btn').click(); }
    else if (current && !$('run-btn').disabled) $('run-btn').click();
  }
  if (e.key === 'r' && !separar) loadEpisodes();
});

// ---------------------------------------------------------------- arranque
(async function boot() {
  STEPS = await api('/api/steps');
  try { tokenInfo = await api('/api/secrets'); } catch (e) {}
  await loadRoot();
  await loadEpisodes();
  openFromHash();
  if (location.hash === '#/separar') loadMsst();
  setInterval(() => { if (!pollTimer) loadEpisodes(); }, 15000);
})();
</script>
</body>
</html>
