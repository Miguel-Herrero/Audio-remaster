[project]
name = "remaster"
version = "2.2.0"
description = "Pipeline determinista de reconstruccion de audio para Sherlock Holmes (1984)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
# Backend de separacion local (audio-separator + torch). Pesado; opcional
# porque el backend mvsep no lo necesita.
local-separation = [
    "audio-separator[cpu]>=0.28",
    # librosa (dependencia de audio-separator) lo importa condicionalmente
    # y no lo declara como dependencia dura; sin esto, separate.py con
    # backend "local" falla en tiempo de ejecucion, no al instalar.
    "audioread>=3.0",
]
# Analisis de audio: sync automatico y loudness por escena.
audio = [
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "matplotlib>=3.8",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
remaster = "remaster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
